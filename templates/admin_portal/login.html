{% extends 'base.html' %}

{% block title %}Master Admin Login - Enigma{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl shadow-2xl shadow-purple-900/10 border border-purple-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-purple-900 via-indigo-900 to-slate-900 px-8 py-10 text-white text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/10 backdrop-blur-md mb-3 border border-white/20 shadow-inner">
                <i class="fa-solid fa-shield-halved text-3xl text-purple-300"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight">Master Admin Portal</h1>
            <p class="text-purple-200 text-xs mt-1">Club Management, Day-Wise Attendance & Daily Quiz Control</p>
        </div>

        <!-- Form Body -->
        <form method="POST" class="p-8 space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1.5">Master Admin Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-user-shield text-sm"></i>
                    </span>
                    <input type="email" name="email" required autocomplete="email" placeholder="admin@club.edu" class="form-input pl-10 border-slate-300 focus:border-purple-600 focus:ring-purple-200">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1.5">Master Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-key text-sm"></i>
                    </span>
                    <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••" class="form-input pl-10 border-slate-300 focus:border-purple-600 focus:ring-purple-200">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 px-4 bg-purple-700 hover:bg-purple-800 text-white font-bold rounded-xl shadow-lg shadow-purple-700/25 transition flex items-center justify-center space-x-2 mt-2">
                <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
                <span>Access Master Portal</span>
            </button>

            <div class="pt-4 border-t border-slate-100 text-center">
                <a href="{% url 'login' %}" class="text-xs text-slate-500 hover:text-slate-800 transition">
                    &larr; Return to Student Sign In
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
